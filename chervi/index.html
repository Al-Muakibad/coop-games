<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Червячки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../shared/i18n.js"></script>
<script src="en.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<link rel="stylesheet" href="../shared/ui.css">
<style>
  body { background: #7cc8f5; }
  #top { position: fixed; top: 0; left: 0; right: 0; padding: calc(6px + env(safe-area-inset-top)) 10px 0; z-index: 3; pointer-events: none; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  #teams { display: flex; flex-direction: column; gap: 3px; }
  .tb { display: flex; align-items: center; gap: 5px; font-weight: 900; font-size: 12px; color: #fff; -webkit-text-stroke: 2.5px #000; paint-order: stroke fill; }
  .tb i { display: block; height: 9px; border: 2px solid #000; border-radius: 5px; min-width: 2px; }
  #tright { text-align: right; }
  #timer { font-size: 30px; font-weight: 900; color: #fff; -webkit-text-stroke: 4px #000; paint-order: stroke fill; line-height: 1; }
  #wind { margin-top: 4px; font-weight: 900; font-size: 12px; color: #fff; -webkit-text-stroke: 2.5px #000; paint-order: stroke fill; }
  #turn { position: fixed; top: calc(70px + env(safe-area-inset-top)); left: 0; right: 0; text-align: center; font-weight: 900; font-size: 16px; color: #fff; -webkit-text-stroke: 3px #000; paint-order: stroke fill; pointer-events: none; z-index: 3; }
  #pad { position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 10px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; z-index: 4; }
  #pad button { flex: 1; height: 58px; border: 3px solid #2b1d14; border-radius: 16px; background: #fff7ea; font-size: 24px; font-weight: 900; box-shadow: 0 4px 0 #2b1d14; color: #2b1d14; touch-action: none; user-select: none; -webkit-user-select: none; }
  #pad button:active, #pad button.on { transform: translateY(3px); box-shadow: 0 1px 0 #2b1d14; background: #ffd34d; }
  #pad #b-wpn { flex: 1.6; font-size: 15px; }
  #pad.off button { opacity: .35; }
  #msg { position: fixed; left: 0; right: 0; top: 38%; text-align: center; font-size: 30px; font-weight: 900; color: #fff; -webkit-text-stroke: 4px #000; paint-order: stroke fill; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; padding: 0 10px; }
  #msg.on { opacity: 1; }
  #wmenu { position: fixed; left: 10px; right: 10px; bottom: calc(86px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; z-index: 6; background: #fff7ea; border: 3px solid #2b1d14; border-radius: 18px; padding: 10px; box-shadow: 0 6px 0 #2b1d14; }
  #wmenu button { border: 2.5px solid #2b1d14; border-radius: 12px; background: #fff; padding: 8px 2px; font: inherit; font-weight: 800; font-size: 12px; color: #2b1d14; }
  #wmenu button b { display: block; font-size: 24px; }
  #wmenu button.on { background: #ffd34d; }
  .modes .btn { text-align: left; } .modes .btn small { display: block; font-weight: 600; font-size: 13px; opacity: .8; margin-top: 2px; }
</style>
</head>
<body>
<canvas id="game" class="full"></canvas>
<div id="top" class="hidden"><div id="teams"></div><div id="tright"><div id="timer"></div><div id="wind"></div></div></div>
<div id="turn"></div>
<div id="msg"></div>
<div id="pad" class="hidden">
  <button id="b-left">◀</button><button id="b-right">▶</button><button id="b-jump">⤴</button><button id="b-wpn">🚀 Базука</button>
</div>
<div id="wmenu" class="hidden"></div>

<div id="screen-menu" class="screen">
  <div class="card">
    <div class="logo">🪱💥</div>
    <h1>Червячки</h1>
    <p class="sub">Команды червячков по очереди лупят друг друга базукой, гранатами и динамитом. Земля разрушается, ветер сносит ракеты, вода — смерть. Потяни пальцем по экрану, как рогатку, и отпусти — выстрел!</p>
    <div class="modes">
      <button class="btn primary" id="m-party">🎉 Позвать друзей<small>До 4 игроков: 1 на 1, 2 на 2, каждый сам за себя</small></button>
      <button class="btn" id="m-bots">🤖 Против бота<small>Твоя команда против команды бота</small></button>
    </div>
    <button class="btn ghost" id="m-menu">Другие игры</button>
  </div>
</div>
<div id="screen-end" class="screen hidden">
  <div class="card">
    <div class="logo" id="end-emoji">🏆</div>
    <h2 id="end-title"></h2>
    <div class="breakdown" id="end-sub"></div>
    <div id="end-buttons"></div>
  </div>
</div>
<script src="../shared/tg.js"></script>
<script src="../shared/sfx.js"></script>
<script src="../shared/ads.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/party.js"></script>
<script src="../shared/stats.js"></script>
<script src="../shared/feedback.js"></script>
<script src="game.js"></script>
</body>
</html>
