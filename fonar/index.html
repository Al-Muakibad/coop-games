<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Красный фонарь</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&family=Rubik:wght@700;800;900&family=Playfair+Display:wght@800;900&display=swap" rel="stylesheet">
<style>
  :root { --sat: env(safe-area-inset-top); --sab: env(safe-area-inset-bottom); --glass: rgba(30, 10, 26, .8); --line: rgba(255, 190, 210, .22);
    --gold: #ffd34d; --rose: #ff6a8a; --cream: #fff3f6; --muted: #c9a8b8; --cash: #7ed957; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #140b16; color: var(--cream); font-family: Nunito, -apple-system, Roboto, Arial, sans-serif; overflow: hidden; touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  button { font-family: inherit; font-weight: 900; border: 0; cursor: pointer; color: inherit; }
  .hud { position: fixed; z-index: 5; pointer-events: none; } .hud button { pointer-events: auto; }
  .chip { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 0 10px; height: 38px; display: flex; align-items: center; gap: 6px; font-weight: 900; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; }
  #top { left: 8px; right: 8px; top: calc(8px + var(--sat)); display: flex; flex-direction: column; gap: 5px; }
  #top .row { display: flex; gap: 5px; align-items: center; }
  #money { font-family: Rubik; font-size: 19px; color: var(--gold); } #tips { font-family: Rubik; font-size: 14px; color: #d8b8ff; }
  #phase { flex: 1; min-width: 0; flex-direction: column; align-items: stretch; justify-content: center; gap: 3px; height: 38px; font-size: 11.5px; padding: 0 9px; }
  #phase span { color: var(--muted); overflow: hidden; text-overflow: ellipsis; } #phase span b { color: var(--cream); }
  .bar { height: 6px; border-radius: 4px; background: rgba(255,255,255,.13); overflow: hidden; position: relative; } .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--rose), var(--gold)); }
  .bar u { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; }
  #lives { font-size: 14px; letter-spacing: -2px; } #menuBtn { width: 38px; justify-content: center; padding: 0; font-size: 18px; }
  #roster { display: flex; gap: 4px; flex-wrap: wrap; } #roster .pc { font-size: 11.5px; height: 24px; padding: 0 8px; border-radius: 10px; display: flex; align-items: center; gap: 4px; font-weight: 900; color: #111; }
  #tip { left: 50%; transform: translateX(-50%); bottom: calc(110px + var(--sab)); max-width: 92%; background: rgba(255, 211, 77, .96); color: #2a1406; padding: 7px 14px; border-radius: 14px; font-weight: 900; font-size: 13.5px; text-align: center; display: none; }
  #toast { z-index: 30; left: 50%; transform: translateX(-50%); top: calc(118px + var(--sat)); max-width: 90%; background: rgba(20,8,20,.92); border: 1px solid var(--line); padding: 8px 14px; border-radius: 14px; font-weight: 800; font-size: 13.5px; text-align: center; opacity: 0; transition: opacity .25s; }
  #toast.on { opacity: 1; }
  #raid { left: 8px; right: 8px; top: calc(118px + var(--sat)); background: linear-gradient(90deg, #8a0010, #c01020); border-radius: 14px; padding: 9px 12px; font-weight: 900; font-size: 14px; text-align: center; display: none; box-shadow: 0 0 30px rgba(255,0,40,.6); animation: blink .6s infinite alternate; }
  @keyframes blink { to { box-shadow: 0 0 6px rgba(255,0,40,.3); } }
  #bottom { left: 10px; right: 10px; bottom: calc(14px + var(--sab)); display: flex; gap: 8px; justify-content: center; align-items: flex-end; }
  .big { padding: 14px 18px; border-radius: 18px; font-size: 16px; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  #act { background: linear-gradient(180deg, #8fd8ff, #3a8ac8); color: #08243a; display: none; }
  #ready { background: linear-gradient(180deg, #ffd34d, #e8a21a); color: #2a1406; display: none; }
  #ready.on { background: linear-gradient(180deg, #7ed957, #3a9a2a); }
  #peek { background: linear-gradient(180deg, #ff6a8a, #b0102a); display: none; }
  #joy { position: fixed; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: rgba(255,255,255,.06); display: none; z-index: 4; pointer-events: none; }
  #joy i { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px; border-radius: 50%; background: rgba(255,211,77,.55); }
  /* панели */
  .sheet { position: fixed; left: 8px; right: 8px; bottom: calc(8px + var(--sab)); z-index: 6; max-height: 56vh; overflow: auto; background: linear-gradient(180deg, #f2e6c8, #e2d0a4); color: #2a1a08; border-radius: 18px; padding: 10px; box-shadow: 0 -8px 30px rgba(0,0,0,.5); transform: translateY(115%); transition: transform .22s; touch-action: pan-y; max-width: 520px; margin: 0 auto; }
  .sheet.on { transform: none; }
  .sh-h { display: flex; flex-direction: column; margin: 0 2px 6px; } .sh-h b { font-family: "Playfair Display", serif; font-size: 20px; } .sh-h span { font-size: 12px; font-weight: 800; color: #7a5a30; }
  .oc { width: 100%; display: flex; align-items: center; gap: 8px; text-align: left; background: rgba(255,255,255,.5); border: 2px solid transparent; border-radius: 13px; padding: 8px; margin-bottom: 5px; color: #2a1a08; }
  .oc.ok { border-color: #2a8a3a; background: rgba(220,255,210,.7); } .oc:disabled { opacity: .55; }
  .oc .ic { font-size: 24px; width: 34px; text-align: center; } .oc .tx { flex: 1; display: flex; flex-direction: column; } .oc .tx b { font-size: 14px; } .oc .tx span { font-size: 11.5px; font-weight: 700; color: #6a5030; } .oc em { font-style: normal; color: #1a7a2a; }
  .oc .pr { font: 900 13px Rubik; white-space: nowrap; }
  .types { display: flex; gap: 6px; } .types button { flex: 1; padding: 9px; border-radius: 12px; background: rgba(0,0,0,.08); font-size: 13px; color: #2a1a08; }
  /* модалки */
  #modal { position: fixed; inset: 0; z-index: 20; background: rgba(8,2,10,.72); display: none; align-items: flex-end; justify-content: center; padding: 10px 10px calc(10px + var(--sab)); }
  #modal.on { display: flex; }
  #mbox { width: 100%; max-width: 520px; max-height: 90vh; overflow: auto; background: linear-gradient(180deg, #2a0f24, #1a0816); border: 1px solid var(--line); border-radius: 22px; padding: 16px; touch-action: pan-y; }
  #mbox h2 { font-family: "Playfair Display", serif; font-size: 23px; margin: 2px 0 8px; color: var(--gold); }
  #mbox p { line-height: 1.45; margin: 6px 0 10px; font-size: 14.5px; }
  .muted { color: var(--muted); font-size: 13px; } .warn { color: #ff8a7a; font-weight: 800; }
  .gold { background: linear-gradient(180deg, #ffd34d, #e8a21a); color: #2a1406; padding: 13px; border-radius: 15px; font-size: 15.5px; width: 100%; box-shadow: 0 4px 0 #9a6a10; }
  .ghost { background: rgba(255,255,255,.1); border: 1px solid var(--line); padding: 12px; border-radius: 15px; font-size: 14.5px; width: 100%; margin-top: 8px; }
  table.rep { width: 100%; border-collapse: collapse; font-size: 14px; margin: 4px 0 10px; } table.rep td { padding: 5px 4px; border-bottom: 1px solid var(--line); } table.rep td:last-child { text-align: right; color: var(--gold); font-weight: 900; }
  .cards { display: flex; flex-direction: column; gap: 7px; margin: 8px 0; }
  .card { display: flex; gap: 10px; align-items: center; text-align: left; background: rgba(255,255,255,.07); border: 2px solid var(--line); border-radius: 14px; padding: 10px; color: var(--cream); }
  .card.mine { border-color: var(--gold); background: rgba(255,211,77,.12); } .card .ic { font-size: 30px; } .card .tx { flex: 1; } .card b { font-size: 15px; display: block; } .card small { color: var(--muted); font-weight: 700; font-size: 12.5px; }
  .card .vt { display: flex; gap: 3px; } .card .vt i { width: 12px; height: 12px; border-radius: 50%; }
  .mech { background: rgba(255,211,77,.1); border: 1px solid rgba(255,211,77,.35); border-radius: 14px; padding: 10px 12px; font-size: 13.5px; line-height: 1.45; margin-bottom: 10px; } .mech b { color: var(--gold); }
  .scene18 { aspect-ratio: 16/10; border-radius: 16px; border: 2px dashed var(--rose); background: radial-gradient(circle at 50% 40%, #5a1030, #1a0410 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 14px; text-align: center; margin: 6px 0 12px; }
  .scene18 code { color: var(--gold); background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 8px; } .scene18 small { color: var(--muted); font-size: 12.5px; }
  /* старт и лобби */
  #start { position: fixed; inset: 0; z-index: 15; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 11px; padding: 24px; background: radial-gradient(ellipse at 50% 30%, rgba(120,10,40,.6), rgba(10,4,14,.95) 70%); text-align: center; }
  #start h1 { font-family: "Playfair Display", serif; font-size: 44px; line-height: 1; margin: 0; color: #ffe0e8; text-shadow: 0 0 18px #ff2a5a, 0 0 40px #ff2a5a; }
  #start .sub { color: var(--muted); font-weight: 800; max-width: 340px; line-height: 1.4; font-size: 14px; }
  #start .gold, #start .ghost { max-width: 340px; }
  #start .code { display: flex; gap: 6px; width: 100%; max-width: 340px; } #start input { flex: 1; min-width: 0; padding: 12px; border-radius: 14px; border: 1px solid var(--line); background: rgba(0,0,0,.35); color: var(--cream); font: 900 16px Rubik; text-transform: lowercase; letter-spacing: 2px; }
  #start .code button { padding: 0 16px; border-radius: 14px; background: rgba(255,255,255,.14); }
  #start .age { font-size: 11.5px; color: var(--muted); }
  #lobby { position: fixed; inset: 0; z-index: 16; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; background: rgba(10,4,14,.94); text-align: center; }
  #lobby h2 { font-family: "Playfair Display", serif; color: var(--gold); margin: 0; font-size: 28px; }
  #lobby .roomcode { font: 900 30px Rubik; letter-spacing: 6px; color: #fff; background: rgba(255,255,255,.08); padding: 6px 16px; border-radius: 14px; }
  #lobby .pl { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 320px; } #lobby .pl div { padding: 10px; border-radius: 12px; font-weight: 900; color: #111; }
  #lobby .gold, #lobby .ghost { max-width: 320px; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="joy"><i></i></div>
<div class="hud" id="top">
  <div class="row">
    <div class="chip" id="money" title="касса банды">💰 0</div>
    <div class="chip" id="phase"><span id="phTxt">Подготовка</span><div class="bar"><i id="phBar"></i><u id="phGoal" style="display:none"></u></div></div>
    <div class="chip" id="lives">❤️❤️❤️</div>
    <button class="chip" id="menuBtn">☰</button>
  </div>
  <div class="row"><div class="chip" id="tips" style="height:26px;font-size:12.5px">💸 0</div><div id="roster"></div></div>
</div>
<div class="hud" id="raid"></div>
<div class="hud" id="toast"></div>
<div class="hud" id="tip"></div>
<div class="hud" id="bottom"><button class="big" id="peek">👁</button><button class="big" id="ready">Готов к ночи</button><button class="big" id="act">✋ Взять</button></div>
<div class="sheet" id="office"></div>
<div class="sheet" id="ward"></div>
<div id="modal"><div id="mbox"></div></div>

<div id="start">
  <h1>Красный<br>фонарь</h1>
  <div class="sub">Кооп на 1–4 человека. Банда держит дом в портовом городе: ночью все бегают, утром выбирают, как расти.</div>
  <button class="gold" id="solo">Играть одному</button>
  <button class="gold" id="host">👥 Собрать банду (до 4)</button>
  <div class="code"><input id="codeIn" maxlength="6" placeholder="код комнаты"><button id="join">Войти</button></div>
  <div class="age">18+ · все персонажи совершеннолетние · откровенных сцен нет — на их месте заглушки с ID<br><a href="v1/" style="color:#c9a8b8">старый прототип с тремя этапами</a> · версия 3</div>
</div>
<div id="lobby"></div>

<script src="../shared/net.js?v=3"></script>
<script type="module" src="main.js?v=3"></script>
</body>
</html>
