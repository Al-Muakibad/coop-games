<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дуэль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../shared/ui.css">
<style>
  body { background: var(--ink); }
  .half { position: fixed; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; color: #fff; transition: background .12s; overflow: hidden; padding: 12px; }
  #p2 { top: 0; height: 50%; transform: rotate(180deg); background: #2f7cf6; }
  #p1 { bottom: 0; height: 50%; background: #ff7a2f; }
  .half.go { background: #22c55e !important; }
  .half.wait { background: #e5484d !important; }
  .half.win { background: #ffd34d !important; color: var(--ink); }
  .half.flash { filter: brightness(1.3); }
  .pts { position: absolute; top: 12px; left: 0; right: 0; font-size: 18px; font-weight: 900; letter-spacing: 3px; opacity: .9; }
  .title { font-size: 15px; font-weight: 800; opacity: .85; text-transform: uppercase; letter-spacing: 1px; min-height: 18px; }
  .big { font-size: 60px; font-weight: 900; line-height: 1.05; margin: 6px 0; min-height: 64px;
    -webkit-text-stroke: 2px rgba(43,29,20,.35); paint-order: stroke fill; }
  .small { font-size: 16px; font-weight: 700; opacity: .92; min-height: 20px; max-width: 320px; }
  .divider { position: fixed; left: 0; right: 0; height: 6px; background: var(--ink); top: calc(50% - 3px); z-index: 2; pointer-events: none; }
  .who { position: absolute; bottom: 12px; font-size: 13px; font-weight: 800; opacity: .75; }
  #screen-start .card, #screen-end .card { max-width: 340px; }
  .players { display: flex; justify-content: center; gap: 10px; margin: 6px 0 2px; font-weight: 800; }
  .chip { padding: 4px 10px; border-radius: 999px; border: 2px solid var(--ink); color: #fff; }
</style>
</head>
<body>
<div id="p2" class="half"><div class="pts" id="p2-pts"></div><div class="title" id="p2-title"></div><div class="big" id="p2-big"></div><div class="small" id="p2-small"></div><div class="who">🔵 СИНИЙ</div></div>
<div class="divider" id="divider"></div>
<div id="p1" class="half"><div class="pts" id="p1-pts"></div><div class="title" id="p1-title"></div><div class="big" id="p1-big"></div><div class="small" id="p1-small"></div><div class="who">🟠 ОРАНЖЕВЫЙ</div></div>

<div id="screen-start" class="screen">
  <div class="card">
    <div class="logo">⚡</div>
    <h1>Дуэль</h1>
    <p class="sub">Положите телефон между собой. Каждый жмёт на свою половину экрана.</p>
    <div class="players"><span class="chip" style="background:#2f7cf6">🔵 Синий — сверху</span><span class="chip" style="background:#ff7a2f">🟠 Оранжевый — снизу</span></div>
    <div class="rules">5 видов раундов: реакция, ловля арбуза, пары, цвета и перетягивание.<br>Кто первым возьмёт <b>3 раунда</b> — победил. Нажал раньше времени — очко сопернику.</div>
    <button class="btn primary" id="btn-start">Начать дуэль</button>
    <button class="btn ghost" id="btn-menu0">Другие игры</button>
  </div>
</div>

<div id="screen-end" class="screen hidden">
  <div class="card">
    <div class="logo" id="end-emoji">🏆</div>
    <h2 id="end-title">Победа</h2>
    <div class="score" id="end-score">3 : 0</div>
    <div class="breakdown" id="end-breakdown"></div>
    <button class="btn primary" id="btn-again">Реванш</button>
    <button class="btn" id="btn-share">Позвать друзей в «Дуэль»</button>
    <button class="btn ghost" id="btn-menu">Другие игры</button>
  </div>
</div>

<script src="../shared/tg.js"></script>
<script src="game.js"></script>
</body>
</html>
