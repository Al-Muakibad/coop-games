<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Дуэль</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<link rel="stylesheet" href="../shared/ui.css">
<style>
  body { background: #2f7cf6; }
  #arena { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    color: #fff; transition: background .1s; background: #2f7cf6; padding: 20px; }
  #arena.go { background: #22c55e; } #arena.wait { background: #e5484d; } #arena.win { background: #ffd34d; color: var(--ink); } #arena.lose { background: #5b6478; }
  #board { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 12px; right: 12px; display: flex; justify-content: space-between; align-items: center;
    color: #fff; font-weight: 900; z-index: 3; pointer-events: none; }
  .side { display: flex; flex-direction: column; gap: 4px; max-width: 42%; }
  .side.r { align-items: flex-end; text-align: right; }
  .side .nm { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-text-stroke: 3px rgba(0,0,0,.45); paint-order: stroke fill; }
  .side .dots { font-size: 22px; letter-spacing: 3px; }
  #vs { font-size: 18px; opacity: .85; }
  .title { font-size: 16px; font-weight: 800; opacity: .9; text-transform: uppercase; letter-spacing: 1px; min-height: 20px; }
  .big { font-size: 68px; font-weight: 900; line-height: 1.05; margin: 8px 0; min-height: 72px; -webkit-text-stroke: 2px rgba(43,29,20,.3); paint-order: stroke fill; }
  .small { font-size: 17px; font-weight: 700; opacity: .95; min-height: 22px; max-width: 340px; }
  #tug { width: 86%; max-width: 360px; height: 34px; border-radius: 999px; border: 4px solid #000; background: #e5484d; overflow: hidden; margin-top: 18px; position: relative; }
  #tug i { position: absolute; left: 0; top: 0; bottom: 0; width: 50%; background: #2f7cf6; transition: width .1s; }
  #tug b { position: absolute; top: -6px; bottom: -6px; width: 6px; background: #000; left: 50%; }
  .modes .btn { text-align: left; } .modes .btn small { display: block; font-weight: 600; font-size: 13px; opacity: .8; margin-top: 2px; }
  .status { margin: 10px 0 2px; font-weight: 700; color: var(--muted); }
  .dotsa::after { content: ""; animation: dd 1.2s infinite; } @keyframes dd { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }
</style>
</head>
<body>
<div id="arena"><div class="title" id="title"></div><div class="big" id="big">⚡</div><div class="small" id="small"></div><div id="tug" class="hidden"><i id="tug-me"></i><b></b></div></div>
<div id="board" class="hidden">
  <div class="side"><div class="nm" id="nm-me">Ты</div><div class="dots" id="dots-me"></div></div>
  <div id="vs">VS</div>
  <div class="side r"><div class="nm" id="nm-opp">Друг</div><div class="dots" id="dots-opp"></div></div>
</div>

<div id="screen-menu" class="screen">
  <div class="card">
    <div class="logo">⚡</div>
    <h1>Дуэль</h1>
    <p class="sub">Кто быстрее? Онлайн 1 на 1: каждый на своём телефоне. 5 видов раундов, до 3 побед. Нажал раньше времени — очко сопернику.</p>
    <div class="modes">
      <button class="btn primary" id="m-invite">⚔️ Позвать друга<small>Отправь приглашение в Telegram</small></button>
      <button class="btn" id="m-bot">🤖 Против бота<small>Разминка перед боем</small></button>
    </div>
    <button class="btn ghost" id="m-menu">Другие игры</button>
  </div>
</div>
<div id="screen-room" class="screen hidden">
  <div class="card">
    <div class="logo" id="room-emoji">📨</div>
    <h2 id="room-title"></h2>
    <p class="sub" id="room-sub"></p>
    <div class="status" id="room-status"></div>
    <div id="room-buttons"></div>
  </div>
</div>
<div id="screen-end" class="screen hidden">
  <div class="card">
    <div class="logo" id="end-emoji">🏆</div>
    <h2 id="end-title"></h2>
    <div class="score" id="end-score"></div>
    <div class="breakdown" id="end-sub"></div>
    <div class="status" id="end-status"></div>
    <div id="end-buttons"></div>
  </div>
</div>

<script src="../shared/tg.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/stats.js"></script>
<script src="game.js"></script>
</body>
</html>
