<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Снайпер: прятки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="../shared/ui.css">
<style>
  body { background: #101831; }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(10px + env(safe-area-inset-top)) 12px 0; pointer-events: none; color: #fff; }
  .row { display: flex; justify-content: space-between; gap: 10px; }
  .pl { flex: 1; }
  .pl.r { text-align: right; }
  .nm { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar { height: 12px; border-radius: 99px; background: rgba(255,255,255,.18); border: 2px solid #000; margin-top: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 100%; transition: width .4s; }
  .pl.r .bar i { margin-left: auto; }
  #turn { text-align: center; margin-top: 8px; font-weight: 800; font-size: 15px; }
  #bullets { text-align: center; font-size: 20px; letter-spacing: 3px; min-height: 24px; margin-top: 2px; }
  #msg { position: fixed; left: 0; right: 0; top: 36%; text-align: center; font-size: 28px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 2px #000; paint-order: stroke fill; pointer-events: none; opacity: 0; transition: opacity .25s; z-index: 5; padding: 0 16px; }
  #msg.on { opacity: 1; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 16px calc(18px + env(safe-area-inset-bottom));
    display: flex; gap: 10px; justify-content: center; align-items: flex-end; }
  #controls .btn { margin: 0; max-width: 220px; }
  #fire { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #000; background: #e5484d; color: #fff;
    font-size: 20px; font-weight: 900; box-shadow: 0 6px 0 #000; font-family: inherit; }
  #fire:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }
  #hint { position: fixed; left: 0; right: 0; bottom: calc(150px + env(safe-area-inset-bottom)); text-align: center;
    color: #fff; font-weight: 700; font-size: 14px; opacity: .85; pointer-events: none; padding: 0 20px; }
  .modes .btn { text-align: left; }
  .modes .btn small { display: block; font-weight: 600; font-size: 13px; opacity: .8; margin-top: 2px; }
  .pass { background: #101831 !important; }
</style>
</head>
<body>
<canvas id="game" class="full"></canvas>

<div id="hud" class="hidden">
  <div class="row">
    <div class="pl"><div class="nm" id="n1"></div><div class="bar"><i id="h1" style="background:#ff7a2f"></i></div></div>
    <div class="pl r"><div class="nm" id="n2"></div><div class="bar"><i id="h2" style="background:#2f7cf6"></i></div></div>
  </div>
  <div id="turn"></div>
  <div id="bullets"></div>
</div>
<div id="msg"></div>
<div id="hint" class="hidden"></div>
<div id="controls" class="hidden"></div>

<div id="screen-menu" class="screen">
  <div class="card">
    <div class="logo">🎯🧱</div>
    <h1>Снайпер: прятки</h1>
    <p class="sub">Один прячется за стеной, другой ищет его в прицел. Пули оставляют дырки — а через дырки видно.</p>
    <div id="challenge" class="challenge hidden"></div>
    <div class="modes">
      <button class="btn primary" id="m-bot">🤖 Против бота<small>Сразу в бой, 3 раунда каждому</small></button>
      <button class="btn" id="m-local">👥 Вдвоём на одном телефоне<small>Передаёте телефон по очереди</small></button>
      <button class="btn" id="m-link">✉️ Вызов другу в Telegram<small>Прячешься — друг ищет по ссылке</small></button>
    </div>
    <button class="btn ghost" id="m-menu">Другие игры</button>
  </div>
</div>

<div id="screen-pass" class="screen pass hidden">
  <div class="card">
    <div class="logo" id="pass-emoji">🔄</div>
    <h2 id="pass-title">Передай телефон</h2>
    <p class="sub" id="pass-sub"></p>
    <button class="btn primary" id="pass-go">Я готов</button>
  </div>
</div>

<div id="screen-end" class="screen hidden">
  <div class="card">
    <div class="logo" id="end-emoji">🏆</div>
    <h2 id="end-title"></h2>
    <div class="breakdown" id="end-sub"></div>
    <div id="end-buttons"></div>
  </div>
</div>

<script src="../shared/tg.js"></script>
<script src="game.js"></script>
</body>
</html>
