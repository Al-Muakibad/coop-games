<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Снайпер: прятки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<link rel="stylesheet" href="../shared/ui.css">
<style>
  body { background: #0b1226; }
  #hud { position: fixed; left: 0; right: 0; top: 0; padding: calc(8px + env(safe-area-inset-top)) 10px 0; pointer-events: none; color: #fff; z-index: 4; }
  .row { display: flex; align-items: flex-start; gap: 8px; }
  .pl { flex: 1; display: flex; gap: 8px; align-items: center; min-width: 0; }
  .pl.r { flex-direction: row-reverse; text-align: right; }
  .av { width: 44px; height: 44px; border-radius: 10px; border: 3px solid #fff; display: grid; place-items: center; font-weight: 900; font-size: 20px; flex: 0 0 44px; box-shadow: 0 3px 0 rgba(0,0,0,.5); }
  .pl .info { flex: 1; min-width: 0; }
  .nm { font-weight: 900; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
  .bar { position: relative; height: 16px; border-radius: 5px; background: #14203d; border: 2px solid #000; margin-top: 3px; overflow: hidden; }
  .hpn { position: absolute; inset: 0; display: grid; place-items: center; font-size: 11px; font-weight: 900; color: #fff; -webkit-text-stroke: 2px #000; paint-order: stroke fill; }
  .bar i.flash { filter: brightness(2.2); }
  #tools { position: fixed; right: 10px; top: calc(118px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; z-index: 7; }
  #tools button { width: 46px; height: 46px; border-radius: 14px; border: 3px solid #000; background: rgba(255,247,234,.95); font-size: 24px; box-shadow: 0 3px 0 #000; }
  #emo-panel { position: fixed; right: 64px; top: calc(118px + env(safe-area-inset-top)); display: grid; grid-template-columns: repeat(3, 50px); gap: 6px; padding: 8px;
    background: rgba(255,247,234,.97); border: 3px solid #000; border-radius: 16px; box-shadow: 0 5px 0 #000; z-index: 8; }
  #emo-panel button { font-size: 30px; background: none; border: 0; padding: 4px; }
  .bubble { position: fixed; top: calc(62px + env(safe-area-inset-top)); font-size: 46px; z-index: 9; pointer-events: none; opacity: 0; transform: scale(.3); transition: opacity .2s, transform .25s cubic-bezier(.2,1.6,.4,1); filter: drop-shadow(0 3px 0 rgba(0,0,0,.4)); }
  .bubble.on { opacity: 1; transform: scale(1); }
  #bub-me { left: 14px; } #bub-opp { right: 14px; }
  #banner { position: fixed; left: 0; right: 0; top: 24%; z-index: 9; display: flex; flex-direction: column; align-items: center; pointer-events: none;
    animation: ban 2.4s ease forwards; }
  #banner .b0 { font-size: 15px; font-weight: 900; letter-spacing: 3px; color: #ffd34d; -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
  #banner .b1 { font-size: 40px; font-weight: 900; color: #fff; -webkit-text-stroke: 5px #000; paint-order: stroke fill; text-align: center; line-height: 1.05; padding: 0 12px; }
  #banner .b2 { margin-top: 6px; font-size: 16px; font-weight: 800; color: #fff; background: rgba(0,0,0,.55); padding: 4px 12px; border-radius: 999px; }
  @keyframes ban { 0% { transform: translateX(-120%); } 14% { transform: translateX(0); } 82% { transform: translateX(0); opacity: 1; } 100% { transform: translateX(120%); opacity: 0; } }
  #vs { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; gap: 14px; background: radial-gradient(#1b2b55, #070b18); color: #fff; }
  #vs .p { text-align: center; width: 38%; } #vs .p .av { margin: 0 auto 8px; width: 74px; height: 74px; font-size: 34px; border-radius: 18px; }
  #vs .p b { display: block; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #vs .x { font-size: 54px; font-weight: 900; color: #ffd34d; -webkit-text-stroke: 4px #000; paint-order: stroke fill; animation: pulse .6s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.15); } }
  .bar i { display: block; height: 100%; width: 100%; transition: width .35s; }
  .pl.r .bar i { margin-left: auto; }
  #timer { flex: 0 0 auto; min-width: 54px; text-align: center; font-weight: 900; font-size: 24px; background: rgba(0,0,0,.55); border: 2px solid #fff; border-radius: 12px; padding: 4px 8px; margin-top: 4px; }
  #timer.warn { background: #c92a2a; }
  #role { text-align: center; margin-top: 6px; font-weight: 900; font-size: 16px; -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
  #ammo { display: flex; gap: 4px; min-height: 12px; }
  #ammo b { width: 26px; height: 9px; border-radius: 0 6px 6px 0; background: linear-gradient(#ffe08a, #d39b18); border: 1.5px solid #000; }
  #ammo b.used { opacity: .25; }
  #coins { font-weight: 900; font-size: 18px; -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
  #msg { position: fixed; left: 0; right: 0; top: 34%; text-align: center; font-size: 30px; font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px #000; paint-order: stroke fill; pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 6; padding: 0 16px; line-height: 1.15; }
  #msg.on { opacity: 1; }
  #big { position: fixed; left: 0; right: 0; top: 56%; text-align: center; font-size: 84px; font-weight: 900; color: #ffd34d;
    -webkit-text-stroke: 5px #000; paint-order: stroke fill; pointer-events: none; z-index: 6; }
  #controls { position: fixed; left: 0; right: 0; bottom: 0; padding: 0 14px calc(16px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; align-items: flex-end; z-index: 5; pointer-events: none; }
  #controls > * { pointer-events: auto; }
  .ctl { width: 92px; height: 92px; border-radius: 50%; border: 3px solid #000; background: rgba(255,255,255,.9); font-size: 36px; font-weight: 900; box-shadow: 0 5px 0 #000; touch-action: none; font-family: inherit; color: #1b1b1b; }
  .ctl.on, .ctl:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; }
  .ctl.small { width: 76px; height: 76px; font-size: 30px; }
  .ctl.fire { width: 118px; height: 118px; background: #e5484d; color: #fff; font-size: 20px; }
  .mid { display: flex; gap: 10px; align-items: flex-end; }
  .modes .btn { text-align: left; }
  .modes .btn small { display: block; font-weight: 600; font-size: 13px; opacity: .8; margin-top: 2px; }
  .shop { text-align: left; margin: 8px 0; }
  .shop .it { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px dashed #d8c7b3; }
  .shop .it:last-child { border: 0; }
  .shop .ic { font-size: 28px; }
  .shop .tx { flex: 1; font-size: 14px; }
  .shop .tx b { display: block; font-size: 16px; }
  .shop .lv { color: var(--muted); font-size: 12px; }
  .shop button { border: 3px solid #000; border-radius: 12px; background: #ffd34d; font-weight: 900; padding: 8px 10px; font-family: inherit; box-shadow: 0 3px 0 #000; }
  .shop button:disabled { opacity: .45; }
  .wallet { font-weight: 900; font-size: 20px; margin: 4px 0; }
  .card { max-height: calc(100vh - 40px); overflow-y: auto; }
  .rank { display: flex; align-items: center; gap: 10px; text-align: left; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 8px 12px; margin: 0 0 12px; box-shadow: 0 3px 0 var(--ink); }
  .rank .rk-ic { font-size: 32px; }
  .rank b { display: block; font-size: 17px; }
  .rank small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .rk-end { font-weight: 800; font-size: 16px; margin-top: 6px; }
  .rk-up { margin-top: 4px; font-weight: 900; color: #d95a12; font-size: 17px; }
  .rk-note { margin-top: 2px; font-size: 12.5px; color: var(--muted); }
  #vs .p small { display: block; font-size: 13px; opacity: .85; margin-top: 4px; white-space: nowrap; }
  .status { margin: 10px 0 2px; font-weight: 700; color: var(--muted); }
  .dots::after { content: ""; animation: dots 1.2s infinite; }
  @keyframes dots { 0% { content: ""; } 33% { content: "."; } 66% { content: ".."; } 100% { content: "..."; } }
</style>
</head>
<body>
<canvas id="game" class="full"></canvas>

<div id="hud" class="hidden">
  <div class="row">
    <div class="pl"><div class="av" id="av1" style="background:#2f7cf6">Я</div><div class="info"><div class="nm" id="n1"></div><div class="bar"><i id="h1" style="background:linear-gradient(#60a5fa,#2563eb)"></i><span class="hpn" id="hn1">100</span></div></div></div>
    <div id="timer">20</div>
    <div class="pl r"><div class="av" id="av2" style="background:#e5484d">?</div><div class="info"><div class="nm" id="n2"></div><div class="bar"><i id="h2" style="background:linear-gradient(#f87171,#dc2626)"></i><span class="hpn" id="hn2">100</span></div></div></div>
  </div>
  <div class="row" style="justify-content:space-between;align-items:center;margin-top:6px"><div id="ammo"></div><div id="coins">🪙 0</div></div>
  <div id="role"></div>
</div>
<div id="tools" class="hidden"><button id="emo-btn">😀</button><button id="snd-btn">🔊</button></div>
<div id="emo-panel" class="hidden"></div>
<div class="bubble" id="bub-me"></div><div class="bubble" id="bub-opp"></div>
<div id="banner" class="hidden"><div class="b0" id="ban0"></div><div class="b1" id="ban1"></div><div class="b2" id="ban2"></div></div>
<div id="vs" class="hidden"><div class="p"><div class="av" style="background:#2f7cf6" id="vs-a1"></div><b id="vs-n1"></b><small id="vs-r1"></small></div><div class="x">VS</div><div class="p"><div class="av" style="background:#e5484d" id="vs-a2"></div><b id="vs-n2"></b><small id="vs-r2"></small></div></div>
<div id="msg"></div>
<div id="big"></div>
<div id="controls" class="hidden"></div>

<div id="screen-menu" class="screen">
  <div class="card">
    <div class="logo">🎯🧱</div>
    <h1>Снайпер: прятки</h1>
    <p class="sub">Онлайн-батл 1 на 1. Один бегает между стенами, второй ищет его в снайперский прицел. Потом меняетесь.</p>
    <div class="rank" id="m-rank"></div>
    
    <div class="modes">
      <button class="btn primary" id="m-invite">⚔️ Позвать друга<small>Онлайн: каждый на своём телефоне</small></button>
      <button class="btn" id="m-bot">🤖 Тренировка с ботом<small>Тоже зарабатываешь монеты</small></button>
    </div>
    <button class="btn ghost" id="m-menu">Другие игры</button>
  </div>
</div>

<div id="screen-room" class="screen hidden">
  <div class="card">
    <div class="logo" id="room-emoji">📨</div>
    <h2 id="room-title">Комната создана</h2>
    <p class="sub" id="room-sub"></p>
    <div class="status" id="room-status"></div>
    <div id="room-buttons"></div>
  </div>
</div>

<div id="screen-shop" class="screen hidden">
  <div class="card">
    <div class="logo">🛒</div>
    <h2>Улучшения</h2>
    <div class="wallet" id="shop-wallet"></div>
    <p class="sub" style="margin:4px 0 6px">Монеты и улучшения — только против этого соперника. Реванш — всё остаётся, новый соперник — с нуля.</p>
    <div class="shop" id="shop-list"></div>
    <button class="btn" id="shop-close">Назад</button>
  </div>
</div>

<div id="screen-end" class="screen hidden">
  <div class="card">
    <div class="logo" id="end-emoji">🏆</div>
    <h2 id="end-title"></h2>
    <div class="breakdown" id="end-sub"></div>
    <div class="verdict" id="end-coins"></div>
    <div id="end-rating"></div>
    <div class="status" id="end-status"></div>
    <div id="end-buttons"></div>
  </div>
</div>

<script src="../shared/tg.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/stats.js"></script>
<script src="../shared/feedback.js"></script>
<script src="game.js"></script>
</body>
</html>
