<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Рикошет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<link rel="stylesheet" href="../shared/ui.css">
<style>
  body { background: #1f2430; touch-action: none; }
  #top { position: fixed; top: 0; left: 0; right: 0; padding: calc(8px + env(safe-area-inset-top)) 10px 0; z-index: 3; pointer-events: none; color: #fff; font-weight: 900; }
  #score { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 15px; -webkit-text-stroke: 3px #000; paint-order: stroke fill; height: 30px; }
  #s-chips { display: flex; gap: 6px; flex-wrap: nowrap; }
  #s-chips span { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px 2px 4px; border-radius: 999px; background: rgba(0,0,0,.35); -webkit-text-stroke: 0; font-size: 16px; }
  #s-chips span.me { box-shadow: 0 0 0 2px #fff inset; }
  #s-chips i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #111; display: inline-block; }
  #feed { margin-top: 2px; font-size: 13px; text-align: right; min-height: 18px; -webkit-text-stroke: 3px #000; paint-order: stroke fill; }
  #msg { position: fixed; left: 0; right: 0; top: 30%; text-align: center; font-size: 32px; font-weight: 900; color: #fff; -webkit-text-stroke: 5px #000; paint-order: stroke fill; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 5; padding: 0 12px; }
  #msg.on { opacity: 1; }
  #hint { position: fixed; bottom: calc(8px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: #e2e8f0; font-weight: 800; font-size: 13px; pointer-events: none; -webkit-text-stroke: 3px #000; paint-order: stroke fill; padding: 0 10px; }
  .modes .btn { text-align: left; } .modes .btn small { display: block; font-weight: 600; font-size: 13px; opacity: .8; margin-top: 2px; }
</style>
</head>
<body>
<canvas id="game" class="full"></canvas>
<div id="top" class="hidden"><div id="score"><span id="s-round"></span><span id="s-chips"></span></div><div id="feed"></div></div>
<div id="hint" class="hidden">Левый палец — езда и поворот, правая половина — выстрел. Снаряды отскакивают — не подстрели себя!</div>
<div id="msg"></div>

<div id="screen-menu" class="screen">
  <div class="card">
    <div class="logo">💣↩️</div>
    <h1>Рикошет</h1>
    <p class="sub">Танки в лабиринте. Снаряды отскакивают от стен — бей из-за угла, но берегись своих же. Одно попадание — и танк взлетел. Новый лабиринт каждый раунд, 5 раундов.</p>
    <div class="modes">
      <button class="btn primary" id="m-bots">🤖 Против ботов<small>Сразу в бой: ты и 3 бота, каждый сам за себя</small></button>
      <button class="btn" id="m-bots2">🤝 2 на 2 с ботами<small>Ты с ботом-напарником против двух ботов</small></button>
      <button class="btn" id="m-party">👥 С друзьями онлайн<small>Одна ссылка в чат. До 4 танков: каждый сам за себя или 2 на 2</small></button>
    </div>
    <button class="btn ghost" id="m-menu">Другие игры</button>
  </div>
</div>
<div id="screen-end" class="screen hidden">
  <div class="card">
    <div class="logo" id="end-emoji">🏆</div>
    <h2 id="end-title"></h2>
    <div class="breakdown" id="end-sub"></div>
    <div id="end-buttons"></div>
  </div>
</div>
<script src="../shared/tg.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/party.js"></script>
<script src="../shared/stats.js"></script>
<script src="../shared/feedback.js"></script>
<script src="game.js"></script>
</body>
</html>
