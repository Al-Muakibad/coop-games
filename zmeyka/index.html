<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Змейка</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="../shared/i18n.js"></script>
<link rel="stylesheet" href="../shared/ui.css">
<style>
  body { background: #1d3b2a; }
  #hud { position: fixed; top: calc(12px + env(safe-area-inset-top)); left: 0; right: 0; display: flex; justify-content: center; gap: 12px; pointer-events: none; }
  .pill { background: rgba(255,247,234,.95); border: 2px solid var(--ink); border-radius: 999px; padding: 6px 14px; font-weight: 900; font-size: 18px; box-shadow: 0 3px 0 var(--ink); }
  #hint { position: fixed; bottom: calc(26px + env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; color: #cfe9d6; font-weight: 700; font-size: 14px; pointer-events: none; }
</style>
</head>
<body>
<canvas id="game" class="full"></canvas>
<div id="hud" class="hidden"><div class="pill" id="h-score">🍎 0</div><div class="pill" id="h-best">⭐ 0</div></div>
<div id="hint" class="hidden">Свайпай в любую сторону</div>

<div id="screen-start" class="screen">
  <div class="card">
    <div class="logo">🐍🍎</div>
    <h1>Змейка</h1>
    <p class="sub">Классика, но сочная. Ешь яблоки, расти и не врезайся в себя. С каждым яблоком быстрее.</p>
    <div id="challenge" class="challenge hidden"></div>
    <div class="rules">Свайп — повернуть · стены пропускают на другую сторону<br>🍎 +1 · 🍇 +3 (исчезает через 5 секунд)</div>
    <button class="btn primary" id="btn-start">Играть</button>
    <div class="best" id="best-start"></div>
  </div>
</div>
<div id="screen-end" class="screen hidden">
  <div class="card">
    <div class="logo">🐍</div>
    <h2 id="end-title">Ой, хвост!</h2>
    <div class="score" id="end-score">0</div>
    <div class="verdict" id="end-verdict"></div>
    <button class="btn primary" id="btn-challenge">Бросить вызов другу</button>
    <button class="btn" id="btn-again">Ещё раз</button>
    <button class="btn ghost" id="btn-menu">Другие игры</button>
  </div>
</div>
<script src="../shared/tg.js"></script>
<script src="../shared/sfx.js"></script>
<script src="../shared/ads.js"></script>
<script src="../shared/stats.js"></script>
<script src="../shared/feedback.js"></script>
<script src="game.js"></script>
</body>
</html>
